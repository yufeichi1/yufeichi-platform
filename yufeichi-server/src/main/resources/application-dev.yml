server:
  port: 8080


spring:
  application:
    name: yufeichi-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/yufeichi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:yufeichi}
    password: ${DB_PASSWORD:yufeichi}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:yufeichi}
      database: 0

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml

  configuration:
    # 数据库字段 user_name 自动映射 Java userName
    map-underscore-to-camel-case: true

    # 开发环境打印SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    db-config:
      # 逻辑删除字段
      logic-delete-field: deleted

      # 删除状态
      logic-delete-value: 1

      # 未删除状态
      logic-not-delete-value: 0


# Knife4j接口文档
knife4j:
  enable: true


# JWT配置
jwt:
  secret: yufeichi-dev-secret-key-change-this-at-least-32-chars

  # Token有效时间（分钟）
  expire-minutes: 1440


# 文件上传
file:
  upload-path: D:/yufeichi/uploads

  # 静态资源访问前缀
  access-prefix: /uploads


# 日志配置
logging:
  level:
    com.yufeichi.server: debug