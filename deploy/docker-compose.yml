services:

  mysql:
    image: mysql:8.4
    container_name: yufeichi-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yufeichi
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci


  redis:
    image: redis:7
    container_name: yufeichi-redis
    restart: always

    command:
      redis-server --requirepass ${REDIS_PASSWORD}

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data


volumes:

  mysql-data:

  redis-data: