server {
    listen 80;
    listen [::]:80;
    server_name yufeichi.com www.yufeichi.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yufeichi.com www.yufeichi.com;
    ssl_certificate /etc/letsencrypt/live/yufeichi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yufeichi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/yufeichi-app/current;
    index index.html;
    client_max_body_size 6m;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;

    location = /api {
        default_type application/json;
        return 404 '{"code":40400,"message":"接口不存在","data":null}';
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        error_page 413 = @payload_too_large;
        error_page 502 503 504 = @backend_unavailable;
    }
    location @backend_unavailable {
        default_type application/json;
        return 503 '{"code":50300,"message":"服务暂不可用，请稍后重试","data":null}';
    }
    location @payload_too_large {
        default_type application/json;
        return 413 '{"code":41300,"message":"上传文件或请求体过大","data":null}';
    }
    # Match only normalized image filenames; never serve hidden temporary files.
    location ~ "^/uploads/((?:avatar|article|project|other)/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}\.(?:png|jpg))$" {
        alias /var/lib/yufeichi/uploads/$1;
        disable_symlinks on;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
    }
    location /uploads/ { alias /var/lib/yufeichi/uploads/; return 404; }
    location = /uploads { return 404; }
    location ^~ /v3/ { return 404; }
    location ^~ /swagger-ui { return 404; }
    location ^~ /webjars/ { return 404; }
    location = /doc.html { return 404; }
    location ~ /\. { return 404; }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
