name: yufeichi-ai-prod
services:
  pgvector:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      POSTGRES_DB: yufeichi_ai
      POSTGRES_USER: ai_vector
      POSTGRES_PASSWORD_FILE: /run/secrets/ai-vector-password
    secrets:
      - ai-vector-password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ai-vector-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_connections=20"]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_vector -d yufeichi_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  ai-vector-password:
    file: /etc/yufeichi/secrets/ai-vector-password
volumes:
  ai-vector-data:
